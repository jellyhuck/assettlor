server:
  port: 3001
  host: 127.0.0.1
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  allowed_hosts: []
data_dir: ./.assettlor
libraries:
  - ./assets
projects:
  - ./game-project
classifiers:
  bpm:
    enabled: true
    minBpm: 60
    maxBpm: 200
    minDurationSeconds: 1
    maxAnalysisSeconds: 45
  sprite:
    enabled: true
    minConfidence: 0.5
    enableVisualAnalysis: true
    enablePathAnalysis: true
    enableStackAnalysis: true
  pack:
    enabled: true
    inferFromArchive: true
    inferFromDirectory: true
    directoryStrategy: top
    directoryDepth: 1
    cleanSeparators: true
    stripVersionSuffix: true
    stripAffixes: false
    caseConvention: as-is
    targetArchives: []
    targetDirectories: []
  folder:
    enabled: true
    includeArchiveFolders: true
pipeline:
  thumbnail_quality: 80
  auto_stack_animations: true
  auto_stack_audio: true
  default_fps: 12
ui:
  catalog_paging: load-more
